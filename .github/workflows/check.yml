name: Check site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:core
      - run: npm run build
        env:
          SITE_BROWSER_TESTS: '1'
      - run: npm install --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - name: Browser regressions
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/site-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4321/Site/__checks/audit/ > /dev/null && break
            sleep 1
          done
          npm run test:browser
